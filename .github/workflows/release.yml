name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.2)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/release.jks

      - name: Verify keystore aliases
        run: |
          keytool -list -keystore $RUNNER_TEMP/release.jks \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" -v 2>&1 | grep -E "Alias name|Entry type"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: edge-tele-key
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "edge-tele ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          body: |
            ## edge-tele ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Offline Gemma AI copilot for disaster field workers.

            **Install:** download the APK, enable *Install from unknown sources* on your device, then open the file.
          files: app/build/outputs/apk/release/*.apk
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
